name: X-M5 experimental builds
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_apple.dart --check
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: Test PHP error reporting service
        run: |
          php -l server/common.php
          php -l server/report.php
          php -l server/admin.php
          php server/tests.php
  build:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            command: flutter build windows --release --dart-define=FUJI_DEFAULT_MODEL=X-M5
            artifact: fuji-san-windows.zip
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug --dart-define=FUJI_DEFAULT_MODEL=X-M5
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - os: macos-15
            target: macos
            command: flutter build macos --release --dart-define=FUJI_DEFAULT_MODEL=X-M5
            artifact: fuji-san-macos.tar.gz
          - os: macos-15
            target: ios
            command: flutter build ios --release --no-codesign --dart-define=FUJI_DEFAULT_MODEL=X-M5
            artifact: |
              fuji-san-ios-unsigned.tar.gz
              FujiSan-XM5-XT5-iOS-unsigned.ipa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Verify Windows updater recovery and archive validation
        if: matrix.target == 'windows'
        shell: powershell
        run: ./tool/test_updater.ps1
      - name: Verify the app can launch the Windows updater helper
        if: matrix.target == 'windows'
        run: flutter test test/updates_test.dart
      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fuji-san-windows.zip
      - name: Preserve Apple bundle permissions and symlinks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = 'macos' ]; then
            tar -czf fuji-san-macos.tar.gz -C build/macos/Build/Products/Release fuji_san.app
          else
            tar -czf fuji-san-ios-unsigned.tar.gz -C build/ios/iphoneos Runner.app
            python3 tool/package_ios.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fuji-san-xm5-${{ matrix.target }}-experimental
          path: ${{ matrix.artifact }}
